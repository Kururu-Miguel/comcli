[tool.poetry]
name = "comcli"
version = "0.1.0"
description = "Um cliente terminal de comunicação descentralizado focado em privacidade"
authors = ["kururu_miguel <justmike9139@gmail.com>"]
license = "GPL-3.0-only"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
libp2p = "^0.8.0"
click = "^8.5.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-mock = "^3.17.0"
pytest-trio = "^0.8.0"
pytest-timeout = "^2.4.0"
pytest-randomly = "^5.0.0"
ruff = "^0.17.1"
mypy = "^2.4.0"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "poetry"
update_changelog_on_bump = true
major_version_zero = true
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
comcli = "comcli.cli:cli"
